resources:
  apps:
    customer360:
      name: customer360
      description: "Customer 360 — Databricks Apps + Lakebase capstone"

      git_repository:
        provider: github
        url: ${var.git_repo_url}
      git_source:
        branch: ${var.git_branch}
        source_code_path: app

      user_api_scopes:
        - sql
        - dashboards.genie

      resources:
        - name: sql_warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: database
          database:
            instance_name: ${var.lakebase_instance}
            database_name: capstone_db
            permission: CAN_CONNECT_AND_CREATE
        - name: genie_space
          genie_space:
            name: ${var.genie_space_id}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: forward_etl_job
          job:
            id: ${resources.jobs.forward_etl.id}
            permission: CAN_MANAGE_RUN
