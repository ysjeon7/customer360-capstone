resources:
  jobs:
    forward_etl:
      name: customer360-forward-etl
      tasks:
        - task_key: forward_etl
          notebook_task:
            notebook_path: ../lakebase/forward_etl/pattern_a_psycopg2/forward_etl.py
            base_parameters:
              catalog: ${var.catalog}
              schema: gold
              instance_name: ${var.lakebase_instance}
              database_name: capstone_db
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - psycopg2-binary
